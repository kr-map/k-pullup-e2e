<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k-pullup API e2e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Galvanized steel and slate ink; color is spent only on failures (signal red) and the selection (equipment yellow). */
  :root {
    --steel-0: #f3f5f6; --steel-1: #e6eaed; --steel-2: #d3d9de; --steel-3: #a9b3bb; --steel-4: #6f7c87;
    --ink: #142028; --ink-2: #3a4853;
    --red: #c8321f; --red-bg: #fbe9e6; --yellow: #f4b400; --yellow-ink: #3d2d00; --green: #23704a; --green-bg: #e3f1e9;
    --amber: #9a5b00; --amber-bg: #fdf1dc; --blue: #2a5bbf;
    --panel: #fff; --code: #f7f8f9;
    --sans: "Archivo", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --k: #6b3fa0; --s: #23704a; --n: #9a5b00; --l: #b0306a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --steel-0: #1c252c; --steel-1: #232e36; --steel-2: #33414b; --steel-3: #566673; --steel-4: #93a2ae;
      --ink: #e8edf1; --ink-2: #b9c4cc;
      --red: #ff6b55; --red-bg: #3a1f1b; --green: #5fd39a; --green-bg: #17302a; --amber: #f5b950; --amber-bg: #33280f; --blue: #8fb3ff;
      --panel: #202a31; --code: #1a2228;
      --k: #c7a6f5; --s: #7fdcab; --n: #f5b950; --l: #f58fc0;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--steel-0); color: var(--ink); font: 15px/1.5 var(--sans); font-variation-settings: "wdth" 100; display: flex; flex-direction: column; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  a { color: var(--blue); }

  /* Top: run headline and the bar */
  .top { padding: 20px 28px 0; background: var(--steel-1); border-bottom: 1px solid var(--steel-2); }
  .brand { font: 700 14px/1 var(--sans); font-variation-settings: "wdth" 90; color: var(--ink-2); margin-bottom: 12px; }
  .headline { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
  .score { display: flex; align-items: baseline; gap: 10px; }
  .score b { font: 800 56px/0.9 var(--sans); font-variation-settings: "wdth" 62; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .score span { color: var(--ink-2); font-size: 15px; max-width: 16ch; line-height: 1.25; }
  .score.bad b { color: var(--red); }
  .facts { display: flex; gap: 22px; color: var(--ink-2); font-size: 14px; padding-bottom: 4px; }
  .facts strong { display: block; color: var(--ink); font: 650 18px/1.2 var(--sans); font-variation-settings: "wdth" 75; font-variant-numeric: tabular-nums; }
  .tools { margin-left: auto; display: flex; gap: 10px; align-items: center; padding-bottom: 4px; }
  .search { width: 280px; max-width: 60vw; padding: 8px 12px; border: 1px solid var(--steel-2); border-radius: 6px; background: var(--panel); }
  .seg { display: inline-flex; border: 1px solid var(--steel-2); border-radius: 6px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--steel-0); }

  .bar { position: relative; margin: 20px 0 0; }
  /* The pull-up bar itself: a steel tube the tests hang from, one notch per test. */
  .bar::before { content: ""; display: block; height: 7px; border-radius: 4px; background: linear-gradient(var(--steel-3), var(--steel-4) 55%, var(--ink-2)); }
  .bar-rail { display: flex; gap: 10px; height: 30px; align-items: flex-start; padding-top: 3px; }
  .bar-group { display: flex; gap: 2px; min-width: 0; }
  .notch { flex: 1 1 0; min-width: 2px; height: 22px; border: 0; padding: 0; border-radius: 0 0 1px 1px; background: var(--steel-3); cursor: pointer; transform-origin: top; }
  .notch.unexpected { background: var(--red); height: 30px; }
  .notch.flaky { background: var(--amber); }
  .notch.skipped { background: var(--steel-2); }
  .notch.dim { opacity: 0.25; }
  .notch:hover { background: var(--ink); }
  .notch[aria-current="true"] { background: var(--yellow); height: 30px; }
  .bar-labels { display: flex; gap: 10px; padding: 4px 0 14px; font-size: 13px; color: var(--ink-2); }
  .bar-labels span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-labels span.bad { color: var(--red); font-weight: 650; }
  @media (prefers-reduced-motion: no-preference) {
    .notch { animation: rep 520ms cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 3ms); }
    @keyframes rep { from { transform: scaleY(0); } }
  }

  /* Body: list + detail */
  main { flex: 1; display: grid; grid-template-columns: minmax(300px, 420px) 1fr; min-height: 0; }
  #list { overflow: auto; border-right: 1px solid var(--steel-2); background: var(--panel); }
  .file { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; gap: 12px; padding: 10px 20px 8px; background: var(--panel); border-bottom: 1px solid var(--steel-2); font: 700 14px/1.3 var(--sans); font-variation-settings: "wdth" 80; }
  .file small { font: 400 13px var(--sans); color: var(--steel-4); font-variant-numeric: tabular-nums; }
  .file small.bad { color: var(--red); font-weight: 650; }
  .item { display: block; width: 100%; text-align: left; padding: 10px 20px 11px 22px; border: 0; border-bottom: 1px solid var(--steel-1); background: transparent; cursor: pointer; position: relative; }
  .item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .item.unexpected::before { background: var(--red); }
  .item.flaky::before { background: var(--amber); }
  .item:hover { background: var(--steel-0); }
  .item[aria-selected="true"] { background: var(--steel-1); }
  .item[aria-selected="true"]::before { background: var(--yellow); }
  .item .ctx { color: var(--steel-4); }
  .item .sub { display: block; margin-top: 3px; color: var(--steel-4); font-size: 13px; font-variant-numeric: tabular-nums; }
  .empty { padding: 48px 24px; color: var(--ink-2); text-align: center; }

  #detail { overflow: auto; padding: 28px 36px 64px; }
  .where { font: 13px var(--mono); color: var(--steel-4); }
  #detail h1 { font: 700 26px/1.25 var(--sans); font-variation-settings: "wdth" 85; letter-spacing: -0.01em; margin: 8px 0 14px; max-width: 46ch; overflow-wrap: anywhere; }
  #detail h1 .ctx { color: var(--steel-4); font-weight: 500; }
  .meta { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; color: var(--ink-2); font-size: 14px; }
  .verdict { font-weight: 700; padding: 3px 10px; border-radius: 4px; }
  .verdict.expected { color: var(--green); background: var(--green-bg); }
  .verdict.unexpected { color: var(--red); background: var(--red-bg); }
  .verdict.flaky { color: var(--amber); background: var(--amber-bg); }
  .verdict.skipped { color: var(--ink-2); background: var(--steel-1); }
  .error { background: var(--red-bg); color: var(--red); border-left: 4px solid var(--red); padding: 14px 16px; margin: 0 0 22px; font: 13px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow: auto; }

  .calls { border-top: 2px solid var(--ink); }
  .setup-note { display: block; width: 100%; text-align: left; padding: 10px 0; border: 0; border-bottom: 1px solid var(--steel-2); background: transparent; color: var(--ink-2); cursor: pointer; font-size: 14px; }
  .setup-note:hover { color: var(--ink); }
  .call { border-bottom: 1px solid var(--steel-2); }
  .call.setup .row { opacity: 0.6; }
  .row { display: grid; grid-template-columns: 62px minmax(0, 1fr) 52px 150px; gap: 14px; align-items: center; width: 100%; padding: 11px 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
  .row:hover .path { text-decoration: underline; text-decoration-color: var(--steel-3); text-underline-offset: 3px; }
  .method { font: 700 13px var(--mono); }
  .path { font: 14px var(--mono); overflow-wrap: anywhere; }
  .path .q { color: var(--steel-4); }
  .code { font: 650 14px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .c2 { color: var(--green); } .c3 { color: var(--blue); } .c4 { color: var(--amber); } .c5, .cx { color: var(--red); }
  .time { display: grid; grid-template-columns: 1fr 50px; gap: 8px; align-items: center; }
  .time i { display: block; height: 6px; border-radius: 3px; background: var(--steel-2); position: relative; overflow: hidden; }
  .time i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--ink-2); border-radius: 3px; }
  .time em { font: normal 13px var(--mono); color: var(--steel-4); text-align: right; font-variant-numeric: tabular-nums; }
  .bodies { display: none; grid-template-columns: 1fr 1fr; gap: 16px; padding: 4px 0 18px; }
  .call.open .bodies { display: grid; }
  .call.open .row .path { font-weight: 600; }
  .body { min-width: 0; }
  .body h3 { margin: 0 0 6px; font: 650 13px var(--sans); color: var(--ink-2); }
  .body h3 span { font-weight: 400; color: var(--steel-4); margin-left: 8px; }
  pre { margin: 0; padding: 12px 14px; background: var(--code); border: 1px solid var(--steel-1); border-radius: 6px; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 440px; overflow: auto; }
  pre .none { color: var(--steel-4); font-style: italic; }
  .k { color: var(--k); } .s { color: var(--s); } .n { color: var(--n); } .l { color: var(--l); }
  .foot { margin-top: 18px; color: var(--steel-4); font-size: 13px; }
  kbd { font: 12px var(--mono); border: 1px solid var(--steel-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }

  /* Endpoints view */
  #endpoints { grid-column: 1 / -1; overflow: auto; padding: 24px 28px 64px; display: none; }
  body.ep main > #list, body.ep main > #detail { display: none; }
  body.ep #endpoints { display: block; }
  .ep-table { width: 100%; border-collapse: collapse; border-top: 2px solid var(--ink); }
  .ep-table th { text-align: left; font: 650 13px var(--sans); color: var(--ink-2); padding: 10px 12px 8px 0; border-bottom: 1px solid var(--steel-2); }
  .ep-table td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--steel-1); vertical-align: top; }
  .ep-table tr.ep-row { cursor: pointer; }
  .ep-table tr.ep-row:hover td { background: var(--steel-1); }
  .ep-table th.num { font: 650 13px var(--sans); }
  .ep-table td.num { font: 14px var(--mono); text-align: right; font-variant-numeric: tabular-nums; width: 70px; }
  .codes { display: flex; flex-wrap: wrap; gap: 6px; }
  .codes span { font: 13px var(--mono); padding: 1px 7px; border-radius: 4px; background: var(--steel-1); }
  .codes span b { font-weight: 650; }
  .ep-tests { display: none; }
  .ep-tests.open { display: table-row; }
  .ep-tests td { padding: 0 0 14px; }
  .ep-tests button { display: block; border: 0; background: none; padding: 4px 0; cursor: pointer; text-align: left; color: var(--blue); }
  .ep-tests button.unexpected { color: var(--red); font-weight: 650; }
  .ep-intro { color: var(--ink-2); max-width: 70ch; margin: 0 0 16px; }

  @media (max-width: 900px) {
    .top { padding: 16px 16px 0; }
    .score b { font-size: 44px; }
    .facts { gap: 16px; }
    .tools { margin-left: 0; width: 100%; flex-wrap: wrap; }
    .search { flex: 1 1 100%; max-width: none; }
    .bar-rail, .bar-labels { gap: 3px; }
    .bar-group { gap: 0.5px; }
    .notch { min-width: 0.5px; }
    main { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
    #list { border-right: 0; border-bottom: 1px solid var(--steel-2); }
    #detail { padding: 20px 16px 48px; }
    .row { grid-template-columns: 54px minmax(0, 1fr) 44px; }
    .time { display: none; }
    .bodies { grid-template-columns: 1fr; }
    .bar-labels span:not(.bad) { display: none; }
  }
</style>
</head>
<body>
<section class="top">
  <div class="brand">k-pullup API e2e</div>
  <div class="headline">
    <div class="score" id="score"></div>
    <div class="facts" id="facts"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="View">
        <button id="vTests" aria-pressed="true">Tests</button>
        <button id="vEndpoints" aria-pressed="false">Endpoints</button>
      </div>
      <div class="seg" role="group" aria-label="Show">
        <button id="onlyFailed" aria-pressed="false">Failed only</button>
        <button id="showSetup" aria-pressed="false">Setup calls</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search tests, paths, status codes" aria-label="Search" autocomplete="off">
    </div>
  </div>
  <div class="bar" aria-label="One notch per test, grouped by file">
    <div class="bar-rail" id="rail"></div>
    <div class="bar-labels" id="railLabels"></div>
  </div>
</section>
<main>
  <nav id="list" aria-label="Tests"></nav>
  <section id="detail" aria-live="polite"></section>
  <section id="endpoints" aria-label="Endpoints"></section>
</main>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); // no numeric entities: highlight() wraps digits
const VERDICT = { expected: 'Passed', unexpected: 'Failed', flaky: 'Flaky', skipped: 'Skipped' };
const fmtMs = (ms) => (ms >= 1000 ? (ms / 1000).toFixed(1) + ' s' : ms + ' ms');
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const area = (file) => file.replace(/\.spec\.ts$/, '');
let onlyFailed = false, showSetup = false, query = '', selected = null;

// Headline
const failed = D.tests.filter((t) => t.outcome === 'unexpected').length;
const flaky = D.tests.filter((t) => t.outcome === 'flaky').length;
const ownCalls = D.tests.reduce((n, t) => n + t.calls.filter((c) => !c.setup).length, 0);
$('#score').className = 'score' + (failed ? ' bad' : '');
$('#score').innerHTML = failed
  ? `<b>${failed}</b><span>of ${D.tests.length} tests failed</span>`
  : `<b>${D.tests.length}</b><span>tests passed${flaky ? `, ${flaky} flaky` : ''}</span>`;
$('#facts').innerHTML =
  `<div><strong>${ownCalls}</strong>API calls checked</div>` +
  `<div><strong>${fmtMs(D.duration)}</strong>run time</div>` +
  `<div><strong>${new Date(D.startedAt).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</strong>started</div>`;

// The bar: one notch per test, a gap between files
const byFile = new Map();
D.tests.forEach((t) => (byFile.get(t.file) || byFile.set(t.file, []).get(t.file)).push(t));
let k = 0, rail = '', labels = '';
for (const [file, ts] of byFile) {
  rail += `<div class="bar-group" style="flex:${ts.length} 1 0">` +
    ts.map((t) => `<button class="notch ${t.outcome}" style="--i:${k++}" data-id="${esc(t.id)}" title="${esc(area(file) + ': ' + t.title.join(' › '))}" aria-label="${esc(t.title.join(' › '))}, ${VERDICT[t.outcome]}"></button>`).join('') + '</div>';
  const bad = ts.filter((t) => t.outcome === 'unexpected').length;
  const label = `${area(file)} ${bad ? `${bad} failed` : ts.length}`;
  labels += `<span style="flex:${ts.length} 1 0" class="${bad ? 'bad' : ''}" title="${esc(label)}">${ts.length >= 4 || bad ? esc(label) : ''}</span>`;
}
$('#rail').innerHTML = rail;
$('#railLabels').innerHTML = labels;
$('#rail').onclick = (e) => { const n = e.target.closest('.notch'); if (n) { setView('tests'); select(n.dataset.id); } };

// Test list
const titleHTML = (t) => {
  const last = t.title[t.title.length - 1], ctx = t.title.slice(0, -1);
  return (ctx.length ? `<span class="ctx">${esc(ctx.join(' › '))} › </span>` : '') + esc(last);
};
const haystack = (t) => (t.file + ' ' + t.title.join(' ') + ' ' + t.calls.map((c) => c.method + ' ' + c.url + ' ' + (c.status ?? '')).join(' ')).toLowerCase();
const matches = (t) => (!onlyFailed || t.outcome === 'unexpected' || t.outcome === 'flaky') && (!query || haystack(t).includes(query));
const visible = () => D.tests.filter(matches);

function renderList() {
  document.querySelectorAll('.notch').forEach((n) => n.classList.toggle('dim', !matches(D.tests.find((t) => t.id === n.dataset.id))));
  const tests = visible();
  if (!tests.length) {
    $('#list').innerHTML = `<div class="empty">${onlyFailed && !query ? 'Nothing failed in this run.' : 'No test matches. Clear the search to see all tests.'}</div>`;
    return;
  }
  const groups = new Map(); tests.forEach((t) => (groups.get(t.file) || groups.set(t.file, []).get(t.file)).push(t));
  let html = '';
  for (const [file, ts] of groups) {
    const bad = ts.filter((t) => t.outcome === 'unexpected').length;
    html += `<div class="file"><span>${esc(area(file))}</span><small class="${bad ? 'bad' : ''}">${bad ? `${bad} failed of ${ts.length}` : plural(ts.length, 'test')}</small></div>`;
    for (const t of ts) {
      const own = t.calls.filter((c) => !c.setup).length;
      html += `<button class="item ${t.outcome}" data-id="${esc(t.id)}" aria-selected="${t.id === selected}">${titleHTML(t)}` +
        `<span class="sub">${own ? plural(own, 'call') : 'no HTTP calls'}, ${fmtMs(t.ms)}</span></button>`;
    }
  }
  $('#list').innerHTML = html;
}
$('#list').onclick = (e) => { const b = e.target.closest('.item'); if (b) select(b.dataset.id); };

// Detail
function highlight(text) {
  return esc(text).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)/gi,
    (m, str, colon, lit, num) => str ? `<span class="${colon ? 'k' : 's'}">${str}</span>${colon || ''}` : lit ? `<span class="l">${lit}</span>` : `<span class="n">${num}</span>`);
}
const bodyHTML = (title, text, note) => `<div class="body"><h3>${title}${note ? `<span>${esc(note)}</span>` : ''}</h3><pre>${text ? highlight(text) : '<span class="none">empty</span>'}</pre></div>`;
const codeClass = (c) => (c.status ? 'c' + String(c.status)[0] : 'cx');
const pathHTML = (url) => { const i = url.indexOf('?'); return i < 0 ? esc(url) : esc(url.slice(0, i)) + `<span class="q">${esc(url.slice(i))}</span>`; };

function callHTML(c, i, slowest) {
  const w = Math.max(2, Math.round((c.ms / slowest) * 100));
  return `<div class="call${c.setup ? ' setup' : ''}" data-i="${i}"><button class="row" aria-expanded="false">` +
    `<span class="method">${esc(c.method)}</span><span class="path">${pathHTML(c.url)}</span>` +
    `<span class="code ${codeClass(c)}">${c.status ?? 'error'}</span>` +
    `<span class="time"><i style="--w:${w}%"></i><em>${fmtMs(c.ms)}</em></span></button>` +
    `<div class="bodies">${bodyHTML('Request', c.request)}${bodyHTML('Response', c.error || c.response, c.error ? 'request failed' : c.responseType)}</div></div>`;
}

function select(id) {
  const t = D.tests.find((x) => x.id === id); if (!t) return;
  selected = id; history.replaceState(null, '', '#' + id);
  document.querySelectorAll('.item').forEach((b) => b.setAttribute('aria-selected', b.dataset.id === id));
  document.querySelectorAll('.notch').forEach((n) => n.setAttribute('aria-current', n.dataset.id === id));
  const setup = t.calls.filter((c) => c.setup).length;
  const shown = t.calls.filter((c) => showSetup || !c.setup);
  const slowest = Math.max(1, ...shown.map((c) => c.ms));
  let calls = setup && !showSetup ? `<button class="setup-note" id="revealSetup">${plural(setup, 'setup call')} hidden: creating and logging in the test's users. Show them</button>` : '';
  t.calls.forEach((c, i) => { if (showSetup || !c.setup) calls += callHTML(c, i, slowest); });
  const own = t.calls.length - setup;
  $('#detail').innerHTML =
    `<div class="where">tests/${esc(t.file)}:${t.line}</div><h1>${titleHTML(t)}</h1>` +
    `<div class="meta"><span class="verdict ${t.outcome}">${VERDICT[t.outcome] || t.outcome}</span><span>${fmtMs(t.ms)}</span>` +
    `<span>${own ? plural(own, 'API call') : 'No HTTP calls'}</span>` +
    `<a href="${esc(D.traceHref)}#?testId=${encodeURIComponent(t.id)}" target="_blank" rel="noopener">Open Playwright trace</a></div>` +
    (t.error ? `<pre class="error">${esc(t.error)}</pre>` : '') +
    (t.calls.length ? `<div class="calls">${calls}</div>` : `<div class="empty">This test checks a websocket or the database directly, so there are no HTTP calls to show.</div>`) +
    `<p class="foot">Open a call to see its request and response. <kbd>j</kbd> and <kbd>k</kbd> step through tests, <kbd>/</kbd> searches.</p>`;
  const sel = document.querySelector('.item[aria-selected="true"]'); sel && sel.scrollIntoView({ block: 'nearest' });
}
$('#detail').onclick = (e) => {
  if (e.target.id === 'revealSetup') { setToggle('showSetup', true); return; }
  const row = e.target.closest('.row'); if (!row) return;
  const open = row.parentElement.classList.toggle('open');
  row.setAttribute('aria-expanded', open);
};

// Endpoints: every call grouped by method and path, numeric IDs folded into :id
const route = (url) => url.split('?')[0].replace(/\/\d+(?=\/|$)/g, '/:id');
function renderEndpoints() {
  const eps = new Map();
  for (const t of D.tests) for (const c of t.calls) {
    if (c.setup && !showSetup) continue;
    if (!matches(t)) continue;
    const key = c.method + ' ' + route(c.url);
    const e = eps.get(key) || eps.set(key, { method: c.method, path: route(c.url), n: 0, codes: {}, tests: new Map() }).get(key);
    e.n++; e.codes[c.status ?? 'error'] = (e.codes[c.status ?? 'error'] || 0) + 1; e.tests.set(t.id, t);
  }
  const rows = [...eps.values()].sort((a, b) => a.path.localeCompare(b.path) || a.method.localeCompare(b.method));
  $('#endpoints').innerHTML = `<p class="ep-intro">${plural(rows.length, 'endpoint')} exercised. Numeric IDs are folded into <code>:id</code>. Open a row to see the tests that call it.</p>` +
    (rows.length ? `<table class="ep-table"><thead><tr><th>Method</th><th>Path</th><th>Status codes seen</th><th class="num">Calls</th><th class="num">Tests</th></tr></thead><tbody>` +
    rows.map((e, i) => `<tr class="ep-row" data-i="${i}"><td class="method">${esc(e.method)}</td><td class="path">${esc(e.path)}</td>` +
      `<td><div class="codes">${Object.entries(e.codes).sort().map(([s, n]) => `<span><b class="${'c' + String(s)[0]}">${esc(s)}</b> ${n}</span>`).join('')}</div></td>` +
      `<td class="num">${e.n}</td><td class="num">${e.tests.size}</td></tr>` +
      `<tr class="ep-tests" id="ep${i}"><td></td><td colspan="4">${[...e.tests.values()].map((t) => `<button class="${t.outcome}" data-id="${esc(t.id)}">${esc(area(t.file))}: ${esc(t.title.join(' › '))}</button>`).join('')}</td></tr>`).join('') +
    `</tbody></table>` : '<div class="empty">No calls match.</div>');
}
$('#endpoints').onclick = (e) => {
  const b = e.target.closest('.ep-tests button'); if (b) { setView('tests'); select(b.dataset.id); return; }
  const r = e.target.closest('.ep-row'); if (r) $('#ep' + r.dataset.i).classList.toggle('open');
};

// Controls
function setView(v) {
  document.body.classList.toggle('ep', v === 'endpoints');
  $('#vTests').setAttribute('aria-pressed', v === 'tests');
  $('#vEndpoints').setAttribute('aria-pressed', v === 'endpoints');
  if (v === 'endpoints') renderEndpoints();
}
function setToggle(id, on) {
  if (id === 'onlyFailed') onlyFailed = on; else showSetup = on;
  $('#' + id).setAttribute('aria-pressed', on);
  renderList(); if (selected) select(selected);
  if (document.body.classList.contains('ep')) renderEndpoints();
}
$('#vTests').onclick = () => setView('tests');
$('#vEndpoints').onclick = () => setView('endpoints');
$('#onlyFailed').onclick = () => setToggle('onlyFailed', !onlyFailed);
$('#showSetup').onclick = () => setToggle('showSetup', !showSetup);
$('#q').oninput = (e) => { query = e.target.value.trim().toLowerCase(); renderList(); if (document.body.classList.contains('ep')) renderEndpoints(); };

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (e.key !== 'j' && e.key !== 'k') return;
  const ids = visible().map((t) => t.id), i = ids.indexOf(selected);
  const next = ids[Math.max(0, Math.min(ids.length - 1, i + (e.key === 'j' ? 1 : -1)))];
  if (next) select(next);
});

renderList();
const first = D.tests.find((t) => t.id === location.hash.slice(1)) || D.tests.find((t) => t.outcome === 'unexpected') || D.tests[0];
if (first) select(first.id); else $('#detail').innerHTML = '<div class="empty">No tests ran.</div>';
</script>
</body>
</html>
